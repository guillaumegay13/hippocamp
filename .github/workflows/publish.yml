name: Publish Package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: node --check scripts/*.cjs
      - run: npm run mcp:smoke
      - name: Verify release tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm publish

  github-packages:
    # Mirror of the npm package on GitHub Packages, so the repository lists it.
    # npmjs.com stays the install path; GitHub's npm registry needs a token to install.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          package-manager-cache: false
      - name: Scope the package name for GitHub Packages
        run: |
          npm pkg set name="@${GITHUB_REPOSITORY_OWNER}/hippocamp"
          npm pkg set repository.url="https://github.com/${GITHUB_REPOSITORY}"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
